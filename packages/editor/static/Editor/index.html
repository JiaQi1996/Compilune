<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Compilune 编辑器</title>
    <style>
      :root {
        color-scheme: light;
        --ui-size: 13px;
        --bg: #f8f7f4;
        --fg: #242c28;
        --line: #e4e5df;
        --accent: #526b56;
        --hover: #e2e8dd;
      }
      html[data-dark="true"] {
        color-scheme: dark;
        --bg: #212723;
        --fg: #e0e5dc;
        --line: #343e34;
        --accent: #a4bf98;
        --hover: #34432f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font:
          var(--ui-size) -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      [hidden] {
        display: none !important;
      }
      #toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 3px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        border-radius: 4px;
        background: transparent;
        padding: 5px 7px;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #toolbar button {
        min-width: 26px;
        min-height: max(27px, calc(var(--ui-size) * 1.5 + 10px));
      }
      #toolbar .rule {
        height: 16px;
        width: 1px;
        background: var(--line);
        margin: 0 3px;
      }
      #editor {
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      #bottom {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 5px 10px;
        font-size: calc(var(--ui-size) * 0.846154);
        opacity: 0.75;
      }
      #file-path {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cm-search {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
        padding: 9px !important;
      }
      .cm-search input {
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px;
        background: var(--bg);
        color: var(--fg);
      }
      .cm-search label {
        font-size: calc(var(--ui-size) * 0.846154);
      }
      .cm-button {
        border: 1px solid var(--line) !important;
        border-radius: 4px !important;
        background: var(--bg) !important;
        color: var(--fg) !important;
      }
      dialog {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 12px;
        width: min(520px, 90%);
        box-shadow: 0 20px 60px #0003;
        padding: 16px;
      }
      dialog::backdrop {
        background: #15201966;
      }
      #picker header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      #picker-query {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        border-radius: 6px;
      }
      #picker-results {
        max-height: 320px;
        overflow: auto;
        margin-top: 10px;
      }
      #picker-results button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px;
        white-space: normal;
      }

      #insert-dialog header {
        margin-bottom: 15px;
      }
      #insert-dialog label {
        display: block;
        margin: 10px 0 5px;
      }
      #insert-dialog input {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        border-radius: 5px;
      }
      #insert-error {
        color: #c97560;
      }
    </style>
    <script src="editor.js" defer></script>
  </head>
  <body>
    <div id="toolbar" hidden role="toolbar" aria-label="LaTeX 编辑工具">
      <button data-command="section" title="章节 ⌘⌥1">标题 ▾</button
      ><span class="rule"></span
      ><button data-command="bold" title="加粗 ⌘B"><b>B</b></button
      ><button data-command="italic" title="斜体 ⌘I"><i>I</i></button
      ><button data-command="underline" title="下划线 ⌘U"><u>U</u></button
      ><span class="rule"></span
      ><button data-command="list" title="无序列表 ⌘⇧8">≡</button
      ><button data-command="ordered" title="有序列表 ⌘⇧7">1.</button
      ><button data-command="math" title="行内公式 ⌘⇧M">∑</button
      ><button data-command="cite" title="文献引用 ⌘⇧C">引用</button
      ><button data-command="ref" title="交叉引用 ⌘⇧R">标签</button
      ><button data-command="image" title="图片 ⌘⇧I">图片</button
      ><button data-command="find" title="查找 ⌘F">查找</button
      ><button data-command="replace" title="替换 ⌘⌥F">替换</button
      ><button data-command="table" title="表格 ⌘⌥⇧T">表格</button
      ><button data-command="completion" title="补全 F5">提示</button
      ><button data-command="back" title="返回 ⌃-">←</button
      ><button data-command="forward" title="前进 ⌃⇧-">→</button
      ><button data-command="palette" title="命令面板 ⌘⇧P">命令</button
      ><button data-command="goto" title="跳转行 ⌃G">跳转</button
      ><button data-command="symbols" title="跳转章节 ⌘⇧O">大纲</button>
    </div>
    <div id="editor" aria-label="LaTeX 书写区"></div>
    <footer id="bottom">
      <span id="file-path">选择一个文件</span
      ><span id="position">UTF-8 · CodeMirror 6</span>
    </footer>
    <dialog id="picker">
      <header>
        <b id="picker-title">快速跳转</b
        ><button id="picker-close" aria-label="关闭">✕</button>
      </header>
      <input
        id="picker-query"
        aria-label="过滤文件或章节"
        placeholder="输入名称…"
      />
      <div id="picker-results"></div>
    </dialog>
  </body>
</html>
